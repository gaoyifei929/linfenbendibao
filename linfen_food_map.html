            --text-light: #7f8c8d;
            --border: #e0e0e0;

            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }

        /* Header */
        .header {

            top: 0;
            left: 0;
            right: 0;

            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .header-title h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .header-title p {
            font-size: 12px;
            opacity: 0.9;
            margin-top: 2px;
        }

        .header-source {
            font-size: 11px;
            opacity: 0.8;
            text-align: right;
        }

        .header-source a {
            color: white;
            text-decoration: underline;
        }

        /* Filter Bar */
        .filter-bar {
            position: fixed;
            top: 60px;
            left: var(--sidebar-width);
            right: 0;
            z-index: 999;
            background: white;
            padding: 10px 16px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            border-bottom: 1px solid var(--border);
            scrollbar-width: none;
        }

        .filter-bar::-webkit-scrollbar { display: none; }

        .filter-btn {
            flex-shrink: 0;
            padding: 6px 16px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: white;
            color: var(--text);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .filter-btn:hover { border-color: var(--primary); color: var(--primary); }
        .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            top: 60px;
            left: 0;
            bottom: 0;
            width: var(--sidebar-width);
            background: white;
            border-right: 1px solid var(--border);
            z-index: 998;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            font-size: 15px;
            color: var(--text);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-count {
            font-size: 12px;
            color: var(--text-light);
            font-weight: 400;
        }

        .sidebar-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .food-card {
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
            margin-bottom: 4px;
        }

        .food-card:hover {
            background: #fef5f5;
            border-color: #fdd;
        }

        .food-card.active {
            background: #fef0f0;
            border-color: var(--primary);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 6px;
        }

        .card-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
            line-height: 1.3;
        }

        .card-rating {
            color: #f39c12;
            font-size: 13px;
            flex-shrink: 0;
            margin-left: 8px;
        }

        .card-tags {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-bottom: 6px;
        }

        .card-tag {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            background: #f0f0f0;
            color: var(--text-light);
        }

        .card-tag.specialty { background: #fff3e0; color: #e67e22; }
        .card-tag.must-eat { background: #fce4ec; color: #e74c3c; }

        .card-info {
            font-size: 12px;
            color: var(--text-light);
            line-height: 1.6;
        }

        .card-price { color: var(--primary); font-weight: 500; }

        /* Route Panel */
        .route-panel {
            border-top: 1px solid var(--border);
            max-height: 40%;
            overflow-y: auto;
        }

        .route-tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
        }

        .route-tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            font-size: 13px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .route-tab:hover { background: #fafafa; }
        .route-tab.active {
            border-bottom-color: var(--primary);
            color: var(--primary);
            font-weight: 600;
        }

        .route-content { padding: 12px; display: none; }
        .route-content.active { display: block; }

        .route-step {
            display: flex;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px dashed var(--border);
        }

        .route-step:last-child { border-bottom: none; }

        .step-time {
            flex-shrink: 0;
            width: 50px;
            font-size: 12px;
            font-weight: 600;
            color: var(--primary);
            padding-top: 2px;
        }

        .step-detail {
            font-size: 13px;
            line-height: 1.5;
        }

        .step-name { font-weight: 600; color: var(--text); }
        .step-desc { color: var(--text-light); font-size: 12px; margin-top: 2px; }

        #map {
            position: fixed;
            top: 100px;
            left: var(--sidebar-width);
            right: 0;
            bottom: 0;
            z-index: 1;
        }

        /* Popup Styles */

            border-radius: 12px !important;
            padding: 0 !important;
            overflow: hidden;

            margin: 0 !important;

        .popup-card {

            display: flex;
            align-items: center;

            height: 100%;

        .popup-name {

            font-weight: 700;
            margin-bottom: 4px;
            color: var(--text);
        }

        .popup-rating {
            color: #f39c12;

        .popup-meta {

            color: var(--text-light);
            line-height: 1.8;
        }

            background: #fef9f0;
            border-radius: 6px;
            font-size: 12px;
            color: #8b6914;
            line-height: 1.5;
        }

                width: 40px;
                height: 4px;
                background: #ddd;
                border-radius: 2px;
                margin: 8px auto;
                cursor: pointer;

            font-size: 16px;

            height: 40px;
            border: 3px solid #eee;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .loading-text {
            margin-top: 16px;
            font-size: 14px;
            color: var(--text-light);
        }

        @keyframes spin { to { transform: rotate(360deg); } }

</head>

    // ==========================================

    const routes = {

            { time: 'DAY1 11:00', name: '🏛️ 鼓楼广场+老街', desc: '游览鼓楼、老街，拍照打卡' },

            { time: 'DAY2 11:30', name: '🍝 小琴劲道狗舌头', desc: '午餐：隐藏彩蛋，宽面片+猪蹄，人气旺' },
            { time: 'DAY2 14:00', name: '🏞️ 汾河公园', desc: '散步消食，欣赏汾河风光' },
            { time: 'DAY2 16:00', name: '🍐 烤梨先生', desc: '下午茶：烤梨温润香甜，逛街解腻' },
            { time: 'DAY2 18:00', name: '🍜 白三刚牛肉丸子面', desc: '晚餐：本地人排名第二，汤底浓郁' },
            { time: 'DAY2 20:30', name: '🥣 鼓楼夜市碗托', desc: '夜宵：荞麦碗托+蒜泥辣椒油，酸辣开胃' }
        ]
    };

    // ==========================================
    // 🎯 筛选分类配置
    // ==========================================
    const filterCategories = [
        { key: 'all', label: '全部', icon: '🍽️' },
        { key: 'must-eat', label: '必吃', icon: '⭐' },
        { key: 'breakfast', label: '早餐', icon: '🌅' },
        { key: 'lunch', label: '午餐', icon: '☀️' },
        { key: 'dinner', label: '晚餐', icon: '🌙' },
        { key: 'snack', label: '小吃', icon: '🍡' },
        { key: 'noodle', label: '面食', icon: '🍜' },
        { key: 'bbq', label: '烧烤', icon: '🍢' },
        { key: 'specialty', label: '临汾特色', icon: '🏮' },
        { key: 'night', label: '夜宵', icon: '🌃' }
    ];

    // ==========================================
    // 🔧 核心逻辑
    // ==========================================
    let map, markers = {}, activeFilter = 'all', activeCardId = null;

    function init() {
        initMap();
        renderFilters();
        renderSidebar();
        renderRoutes();
        bindEvents();
        
        // Hide loading
        setTimeout(() => {
            document.getElementById('loading').style.opacity = '0';
            setTimeout(() => document.getElementById('loading').remove(), 300);
        }, 500);
    }

    function initMap() {
        // 临汾市中心坐标
        map = L.map('map', {
            center: [36.088, 111.519],
            zoom: 14,
            zoomControl: false,
            attributionControl: false
        });

        // 使用 OpenStreetMap 瓦片
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // 添加缩放控件到右下角
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // 添加所有标记
        foodLocations.forEach(food => addMarker(food));
    }

    function addMarker(food) {
        if (!food.lat || !food.lng) return;

        const icon = L.divIcon({
            className: '',
            html: `<div class="custom-marker" id="marker-${food.id}" title="${food.name}">${food.icon || '🍴'}</div>`,
            iconSize: [36, 36],
            iconAnchor: [18, 18],
            popupAnchor: [0, -20]
        });

        const marker = L.marker([food.lat, food.lng], { icon })
            .addTo(map)
            .bindPopup(createPopupContent(food), { 
                maxWidth: 320, 
                closeButton: true,
                className: 'custom-popup'
            });

        marker.on('mouseover', () => marker.openPopup());
        marker.on('click', () => selectFood(food.id));

        markers[food.id] = marker;
    }

    function createPopupContent(food) {
        const stars = '★'.repeat(food.rating) + '☆'.repeat(5 - food.rating);
        const imgUrl = food.image 
            ? `<img src="${food.image}" alt="${food.name}" onerror="this.parentElement.innerHTML='暂无可靠图片'">`
            : '暂无可靠图片';
        
        return `
            <div class="popup-card">
                <div class="popup-img">${imgUrl}</div>
                <div class="popup-body">
                    <div class="popup-name">${food.name}</div>
                    <div class="popup-rating">${stars}</div>
                    <div class="popup-meta">
                        <strong>推荐菜：</strong>${food.dishes || '暂未确认'}<br>
                        <strong>人均：</strong><span style="color:#e74c3c;font-weight:600">${food.price || '暂未确认'}</span><br>
                        <strong>营业时间：</strong>${food.hours || '暂未确认'}<br>
                        <strong>地址：</strong>${food.address || '地址暂未确认'}<br>
                        <strong>排队：</strong>${food.queue || '视情况而定'}
                    </div>
                    ${food.reason ? `<div class="popup-reason">💡 ${food.reason}</div>` : ''}
                </div>
            </div>
        `;
    }

    function renderFilters() {
        const bar = document.getElementById('filterBar');
        bar.innerHTML = filterCategories.map(cat => 
            `<button class="filter-btn ${cat.key === 'all' ? 'active' : ''}" 
                     data-filter="${cat.key}">
                ${cat.icon} ${cat.label}
            </button>`
        ).join('');
    }

    function renderSidebar(filteredFoods) {
        const foods = filteredFoods || foodLocations;
        const list = document.getElementById('sidebarList');
        document.getElementById('foodCount').textContent = `${foods.length} 家`;

        list.innerHTML = foods.map(food => {
            const stars = '★'.repeat(food.rating) + '☆'.repeat(5 - food.rating);
            const tags = [];
            if (food.tags) food.tags.forEach(t => {
                const cls = t === '临汾特色' ? 'specialty' : t === '必吃' ? 'must-eat' : '';
                tags.push(`<span class="card-tag ${cls}">${t}</span>`);
            });

            return `
                <div class="food-card" data-id="${food.id}" onclick="selectFood('${food.id}')">
                    <div class="card-top">
                        <div class="card-name">${food.icon || '🍴'} ${food.name}</div>
                        <div class="card-rating">${stars}</div>
                    </div>
                    <div class="card-tags">${tags.join('')}</div>
                    <div class="card-info">
                        <span class="card-price">💰 ${food.price || '未知'}</span> · 
                        🕐 ${food.mealTime || '全天'} · 
                        📍 ${food.area || '尧都区'}
                    </div>
                </div>
            `;
        }).join('');
    }

    function renderRoutes() {
        const renderSteps = (steps) => steps.map(s => `
            <div class="route-step">
                <div class="step-time">${s.time}</div>
                <div class="step-detail">
                    <div class="step-name">${s.name}</div>
                    <div class="step-desc">${s.desc}</div>
                </div>
            </div>
        `).join('');

        document.getElementById('route1day').innerHTML = renderSteps(routes.oneDay);
        document.getElementById('route2day').innerHTML = renderSteps(routes.twoDay);
    }

    function selectFood(id) {
        // Update active card
        document.querySelectorAll('.food-card').forEach(c => c.classList.remove('active'));
        const card = document.querySelector(`.food-card[data-id="${id}"]`);
        if (card) {
            card.classList.add('active');
            card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // Update marker
        document.querySelectorAll('.custom-marker').forEach(m => m.classList.remove('active'));
        const markerEl = document.getElementById(`marker-${id}`);
        if (markerEl) markerEl.classList.add('active');

        // Pan map and open popup
        const food = foodLocations.find(f => f.id === id);
        if (food && food.lat && food.lng) {
            map.flyTo([food.lat, food.lng], 16, { duration: 0.8 });
            if (markers[id]) {
                setTimeout(() => markers[id].openPopup(), 400);
            }
        }

        activeCardId = id;
    }

    function applyFilter(key) {
        activeFilter = key;
        
        // Update buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.filter === key);
        });

        // Filter foods
        let filtered;
        if (key === 'all') {
            filtered = foodLocations;
        } else if (key === 'must-eat') {
            filtered = foodLocations.filter(f => f.tags && f.tags.includes('必吃'));
        } else if (key === 'specialty') {
            filtered = foodLocations.filter(f => f.tags && f.tags.includes('临汾特色'));
        } else {
            filtered = foodLocations.filter(f => 
                f.categories && f.categories.includes(key)
            );
        }

        // Update sidebar
        renderSidebar(filtered);

        // Show/hide markers
        foodLocations.forEach(food => {
            const marker = markers[food.id];
            if (!marker) return;
            
            const visible = filtered.some(f => f.id === food.id);
            if (visible) {
                marker.addTo(map);
            } else {
                map.removeLayer(marker);
            }
        });
    }

    function bindEvents() {
        // Filter clicks
        document.getElementById('filterBar').addEventListener('click', e => {
            if (e.target.classList.contains('filter-btn')) {
                applyFilter(e.target.dataset.filter);
            }
        });

        // Route tabs
        document.querySelectorAll('.route-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.route-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.route-content').forEach(c => c.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.route === '1day' ? 'route1day' : 'route2day').classList.add('active');
            });
        });

        // Mobile sidebar toggle
        const toggle = document.getElementById('sidebarToggle');
        if (toggle) {
            toggle.addEventListener('click', () => {
                document.getElementById('sidebar').classList.toggle('collapsed');
            });
        }
    }

    // Initialize when DOM ready
    document.addEventListener('DOMContentLoaded', init);
    </script>
